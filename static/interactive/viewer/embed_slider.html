<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D-Belief Reveal Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #000000;
        color: #f4f4f5;
        --input-col-width: max(220px, 26vw);
        --viewer-col-width: calc(100vw - var(--input-col-width));
        --controls-height: 60px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
      }

      #viewer {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: calc(100vh - var(--controls-height));
        display: block;
        background: #000000;
      }

      .input-screen {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--input-col-width);
        padding: 14px;
        border-right: 1px solid #1a1a1a;
        background: #f7f7f7;
      }

      .input-screen[hidden] {
        display: none;
      }

      .input-frame {
        position: relative;
        width: 100%;
        max-width: min(360px, 100%);
        aspect-ratio: 1 / 1;
        overflow: hidden;
        border-radius: 8px;
        background: #111111;
        box-shadow: 0 10px 32px rgba(0, 0, 0, 0.18);
      }

      .input-frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .input-badge {
        position: absolute;
        left: 8px;
        top: 8px;
        padding: 2px 7px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.62);
        color: #ffffff;
        font-size: 10px;
        font-weight: 800;
        line-height: 1.3;
      }

      body.has-input-panel {
        background: #ffffff;
      }

      body.has-input-panel #viewer {
        left: var(--input-col-width);
        width: var(--viewer-col-width);
      }

      body.has-input-panel .progress {
        left: calc(var(--input-col-width) + (var(--viewer-col-width) / 2));
      }

      body.has-input-panel .viewer-controls {
        left: var(--input-col-width);
        right: 0;
        width: var(--viewer-col-width);
      }

      .progress {
        position: fixed;
        left: 50%;
        top: calc((100vh - var(--controls-height)) / 2);
        width: min(320px, 72vw);
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        background: rgba(8, 10, 14, 0.84);
        text-align: center;
        transform: translate(-50%, -50%);
        backdrop-filter: blur(18px);
      }

      .progress progress {
        width: 100%;
        margin-top: 9px;
      }

      .progress[hidden] {
        display: none;
      }

      .viewer-controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        display: grid;
        grid-template-columns: auto minmax(120px, 1fr) auto auto;
        align-items: center;
        gap: 12px;
        width: 100vw;
        height: var(--controls-height);
        padding: 0 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(8, 10, 14, 0.92);
        color: rgba(255, 255, 255, 0.88);
        font-size: 12px;
        line-height: 1;
        backdrop-filter: blur(18px);
      }

      .viewer-controls input[type="range"] {
        width: 100%;
        accent-color: #ffffff;
        cursor: pointer;
      }

      .viewer-controls span {
        white-space: nowrap;
      }

      .toggle-imagined {
        white-space: nowrap;
        padding: 6px 11px;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.92);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      .toggle-imagined:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.4);
      }

      .toggle-imagined[aria-pressed="true"] {
        background: #ffffff;
        border-color: #ffffff;
        color: #0b0e14;
      }

      @media (max-width: 760px) {
        body.has-input-panel {
          --input-panel-height: min(32vh, 220px);
          --viewer-panel-height: calc(100vh - var(--input-panel-height) - var(--controls-height));
        }

        body.has-input-panel .input-screen {
          right: 0;
          bottom: auto;
          width: 100vw;
          height: var(--input-panel-height);
          padding: 10px;
          border-right: 0;
          border-bottom: 1px solid #1a1a1a;
        }

        body.has-input-panel .input-frame {
          width: auto;
          height: 100%;
        }

        body.has-input-panel #viewer {
          left: 0;
          top: var(--input-panel-height);
          width: 100vw;
          height: var(--viewer-panel-height);
        }

        body.has-input-panel .progress {
          left: 50%;
          top: calc(var(--input-panel-height) + (var(--viewer-panel-height) / 2));
        }

        body.has-input-panel .viewer-controls {
          left: 0;
          right: 0;
          width: 100vw;
        }
      }
    </style>
  </head>
  <body>
    <div id="input-screen" class="input-screen" hidden>
      <div class="input-frame">
        <img id="input-image" alt="" />
        <span class="input-badge">Input</span>
      </div>
    </div>
    <canvas id="viewer"></canvas>
    <div class="viewer-controls" aria-label="Reveal imagined geometry">
      <span>Observed</span>
      <input id="reveal-slider" type="range" min="0" max="9" step="1" value="0" />
      <span>Imagined</span>
      <button
        id="toggle-imagined"
        class="toggle-imagined"
        type="button"
        aria-pressed="false"
        title="Toggle the imagined scene on or off"
      >
        Toggle Imagined
      </button>
    </div>
    <div id="progress" class="progress" hidden>
      <div id="progress-label">Loading Gaussian scene...</div>
      <progress id="progress-bar" max="100" value="0"></progress>
    </div>
    <script type="module" src="./embed_slider.js?v=project_page_interactive_v2"></script>
  </body>
</html>
